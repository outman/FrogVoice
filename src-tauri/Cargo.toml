[package]
name = "FrogVoice"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "frog_voice_lib"
# Note: lib name uses underscores (Cargo convention) and _lib suffix to avoid Windows conflict
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["aac", "flac", "mp3", "ogg", "wav", "pcm", "aiff", "alac", "isomp4", "mpa"] }
mp3lame-encoder = "0.2"
rubato = "0.15"

# Patch mp3lame-sys to support cross-compilation to Windows from Unix.
# The original crate uses autotools (./configure) which cannot cross-compile
# to Windows MSVC. This patch uses the cc crate for Windows targets instead.
[patch.crates-io]
mp3lame-sys = { path = "patches/mp3lame-sys" }

